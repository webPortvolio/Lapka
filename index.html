<style>

:root[data-theme="dark"]{--bg1:#1d1050;--bg2:#4a1d6e;--bg3:#2a2a8a;--ink:#fff3e0;--mute:#c9b8f0;--card:#2a1856cc;--accent:#ff6b9d;--line:#fff3e02e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(165deg,var(--bg1),var(--bg2) 60%,var(--bg3));color:var(--ink);font:400 16px/1.5 Rubik,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff9 0,#fff0 70%);animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-10vmax}
.bg i:nth-child(2){width:36vmax;height:36vmax;right:-10vmax;bottom:-8vmax;animation-delay:-5s}
.bg i:nth-child(3){width:22vmax;height:22vmax;right:18vmax;top:6vmax;animation-delay:-9s;opacity:.6}
@keyframes fl{to{transform:translate(4vmax,3vmax) scale(1.12)}}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.hud button,.hud .lang{pointer-events:auto}
h1{font:800 clamp(28px,5vw,48px)/1 Rubik,sans-serif;letter-spacing:-.03em;margin:0}
.glass{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lv{margin-top:10px;padding:10px 14px;width:min(52vw,250px)}
.lv b{font:800 15px Rubik,sans-serif}
.lv .row{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:2px}
.bar{height:8px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:6px;transition:width .4s}
.tray{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;max-width:min(52vw,300px)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px 2px 5px;font-size:12px;font-weight:600}
.chip i{width:11px;height:11px;border-radius:50%;display:block}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tools{display:flex;gap:6px}
.lang{display:flex;padding:3px;border-radius:999px}
.lang button,.snd{all:unset;cursor:pointer;padding:5px 11px;border-radius:999px;font-weight:600;font-size:13px}
.lang button[aria-pressed=true]{background:var(--accent);color:#fff}
.snd{background:var(--card);border:1px solid var(--line);padding:5px 10px;font-size:15px;line-height:1.3}
.stats{display:flex;gap:6px}
.stat{padding:7px 12px;text-align:right;min-width:70px}
.stat b{display:block;font:800 22px/1.1 Rubik,sans-serif}
.stat span{font-size:11px;color:var(--mute)}
.hearts{letter-spacing:1px;color:var(--accent);font-size:18px;line-height:1.2}
.hearts s{text-decoration:none;opacity:.2}
.combo{position:fixed;left:50%;top:calc(88px + env(safe-area-inset-top,0px));transform:translateX(-50%);font:800 38px/1 Rubik,sans-serif;color:var(--gold);text-shadow:0 3px 0 #1c1240;opacity:0;pointer-events:none}
.combo.on{opacity:1;animation:cp .4s ease-out}
@keyframes cp{from{transform:translateX(-50%) scale(1.6)}}
.wind{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));padding:6px 14px;font-weight:600;font-size:14px}
.wind[hidden]{display:none}
.keys{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:18px;pointer-events:none;color:var(--mute);font-size:13px}
.kg{display:flex;align-items:center;gap:8px}
kbd{display:inline-grid;place-items:center;min-width:34px;height:34px;padding:0 9px;border-radius:9px;background:var(--card);border:1px solid var(--line);border-bottom-width:3px;font:600 14px Rubik,sans-serif;color:var(--ink);transition:transform .06s,background .06s}
kbd.on{background:var(--accent);color:#fff;transform:translateY(2px);border-bottom-width:1px}
.wasd{display:grid;grid-template-columns:repeat(3,34px);gap:4px}
.wasd kbd:nth-child(1){grid-column:2}
.ctl{position:fixed;left:0;right:0;bottom:0;padding:0 22px calc(20px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none}
.ctl>*{pointer-events:auto}
body.touch .ctl{display:flex}body.touch .keys{display:none}
.joy{width:132px;height:132px;border-radius:50%;background:var(--card);border:1px solid var(--line);position:relative;touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--accent);box-shadow:0 4px 0 #b0245a}
.go{all:unset;cursor:pointer;touch-action:none;width:104px;height:104px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:800 16px Rubik,sans-serif;box-shadow:0 6px 0 #b0245a;transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(5px);box-shadow:0 1px 0 #b0245a}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.toast{position:fixed;left:50%;top:27%;transform:translateX(-50%);font:800 clamp(26px,6vw,50px)/1 Rubik,sans-serif;letter-spacing:-.02em;color:var(--accent);opacity:0;pointer-events:none;text-shadow:0 3px 0 #fff9;white-space:nowrap}
.toast.on{animation:pop 1.3s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,16px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}
.flash{position:fixed;inset:0;background:radial-gradient(circle,#ff3d3d00 30%,#ff3d3dcc);opacity:0;pointer-events:none}
.flash.on{animation:fl2 .6s ease-out}
@keyframes fl2{from{opacity:1}to{opacity:0}}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#1c124066;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px}
.ov[hidden],#fail[hidden]{display:none}
.card{background:var(--bg1);color:var(--ink);border-radius:30px;padding:30px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px #1c124066}
.card h2{font:800 clamp(38px,9vw,56px)/1 Rubik,sans-serif;margin:0 0 8px;letter-spacing:-.04em}
.card p{margin:0 0 16px;color:var(--mute)}
.rules{list-style:none;padding:0;margin:0 0 20px;text-align:left;font-size:14px;color:var(--ink)}
.rules li{padding:7px 0;border-top:1px solid var(--line)}
.stars{font-size:34px;color:var(--gold);letter-spacing:4px;margin-bottom:6px}
.cta{all:unset;cursor:pointer;display:inline-block;background:var(--accent);color:#fff;padding:15px 34px;border-radius:999px;font:800 17px Rubik,sans-serif;box-shadow:0 5px 0 #b0245a}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #b0245a}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center}
@media (max-width:560px){.stat{min-width:58px;padding:5px 9px}.stat b{font-size:19px}.tray{display:none}.lv{width:44vw;padding:8px 10px}.go{width:92px;height:92px}.joy{width:118px;height:118px}.hearts{font-size:15px}}

</style>
</head>

var tg=(S.st==='close'||S.st==='up'||S.st==='move')?S.closeTarget:PT[S.st],dpp=tg-pa,stp=2.6*dt;pa+=Math.max(-stp,Math.min(stp,dpp));
prongs.forEach(function(pv){pv.rotation.z=pa});
var rvx=dt>0?(cx-pcx)/dt:0,rvz=dt>0?(cz-pcz)/dt:0;pcx=cx;pcz=cz;
avx+=((-rvx*.045-ax)*40-avx*6)*dt;ax=Math.max(-.14,Math.min(.14,ax+avx*dt));
avz+=((rvz*.045-az)*40-avz*6)*dt;az=Math.max(-.14,Math.min(.14,az+avz*dt));
if(reduce){ax=az=0}
if(S.held&&(S.st==='up'||S.st==='move')){
var hz=Math.max(0,(1-S.holdQ)*.9+(Math.abs(ax)+Math.abs(az))*1.6+.02*S.level-.22);
if(Math.random()<hz*dt){var hm=S.held;S.held=null;release(hm,false,rvx*.35,rvz*.35);S.combo=0;hud();toast(T('slip'));sfx('miss')}}
var L=4.9-cy;pend.position.set(cx,4.9,cz);pend.rotation.set(az,0,ax);claw.position.set(0,-L,0);
cable.scale.y=Math.max(.01,L-.15);cable.position.y=-(L-.15)/2;
bridge.position.z=cz;carriage.position.set(cx,4.9,cz);
var c=wp(claw),nn=nearest(c),good=nn&&(nn.d+nn.m.userData.r<=.8);
ret.position.x=c.x;ret.position.z=c.z;ret.visible=play&&(S.st==='idle'||S.st==='down'||S.st==='close');ret.material.color.setHex(good?0x14c79a:0xff3d7f);
spot.position.set(c.x,6.5,c.z);spot.target.position.set(c.x,0,c.z);
for(var i=falling.length-1;i>=0;i--){
var f=falling[i],m=f.m,u=m.userData;f.vy-=18*dt;m.position.y+=f.vy*dt;m.position.x+=f.vx*dt;m.position.z+=f.vz*dt;f.vx*=.98;f.vz*=.98;
m.rotation.x+=f.sx*dt;m.rotation.z+=f.sz*dt;
if(m.position.y<=u.rest){
m.position.y=u.rest;m.rotation.x=0;m.rotation.z=0;falling.splice(i,1);
var inChute=Math.abs(m.position.x-CH.x)<.55&&Math.abs(m.position.z-CH.z)<.55;
if(f.chute||inChute)vanish.push({m:m,t:0});
else{m.position.x=Math.max(-2.85,Math.min(2.85,m.position.x));m.position.z=Math.max(-2.15,Math.min(2.15,m.position.z));u.wob=1;u.wt=0;items.push(m)}}}
relax(dt);
for(i=vanish.length-1;i>=0;i--){var v=vanish[i];v.t+=dt;var sc3=Math.max(.001,1-v.t/.3);v.m.scale.set(sc3,sc3,sc3);v.m.position.y+=dt*1.5;
if(v.t>=.3){vanish.splice(i,1);collect(v.m)}}
if(play&&S.st==='idle'&&S.tries<=0&&!falling.length&&!vanish.length&&!S.over)endLevel()}
function endLevel(){
S.over=true;var total=S.total+S.score,ok=S.score>=S.goal;
if(total>best){best=total;try{localStorage.setItem('lapa-best',String(best))}catch(e){}}
var r=S.score/S.goal;$('stars').textContent=ok?(r>=2?'★★★':r>=1.5?'★★☆':'★☆☆'):'☆☆☆';
S.endMode=ok?'next':'again';
if(ok){S.total=total;sfx('level')}else sfx('miss');
$('endt').textContent=ok?T('done'):T('over');
$('endp').textContent=ok?T('doneP',{s:S.score,g:S.goal,t:S.total}):T('overP',{n:S.level,s:S.score,g:S.goal,t:total});
$('again').textContent=ok?T('next'):T('again');
S.endData={ok:ok,s:S.score,g:S.goal,t:ok?S.total:total,n:S.level};
hud();$('end').hidden=false;$('again').focus()}
function applyText(){
var d=D[lang];document.documentElement.lang=lang;document.title=d.title+' — 3D';
Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=d[e.getAttribute('data-t')]});
Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),function(e){e.setAttribute('aria-label',d[e.getAttribute('data-a')])});
$('lu').setAttribute('aria-pressed',lang==='uk');$('le').setAttribute('aria-pressed',lang==='en');
drawSign();
if(S.wind){$('wind').textContent=(S.wind<0?'←  ':'→  ')+T('wind')}
if(!$('end').hidden&&S.endData){var e=S.endData;$('endt').textContent=e.ok?T('done'):T('over');$('endp').textContent=e.ok?T('doneP',{s:e.s,g:e.g,t:e.t}):T('overP',{n:e.n,s:e.s,g:e.g,t:e.t});$('again').textContent=e.ok?T('next'):T('again')}
hud()}
function setLang(l){lang=l;applyText();try{localStorage.setItem('lapa-lang',l)}catch(e){}}
var KC={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'},
KF={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r','ц':'u','і':'d','ы':'d','ф':'l','в':'r'},CAPK={u:'w',d:'s',l:'a',r:'d'};
function dirKey(e){return KC[e.code]||KF[e.key]||KF[(e.key||'').toLowerCase()]||null}
function capKey(k,on){var e=document.querySelector('kbd[data-k="'+k+'"]');if(e)e.classList.toggle('on',on)}
function setTouch(v){document.body.classList.toggle('touch',v)}
setTouch(matchMedia('(pointer: coarse)').matches);
function startGame(){
if(S.phase!=='menu')return;
try{var A=window.AudioContext||window.webkitAudioContext;if(A&&!AC)AC=new A();if(AC&&AC.resume)AC.resume()}catch(e){}
$('menu').hidden=true;S.total=0;startLevel(1)}
function releaseKeys(){K.u=K.d=K.l=K.r=0;jx=jz=0;['w','a','s','d','space'].forEach(function(k){capKey(k,false)})}
document.addEventListener('keydown',function(e){
var sp=e.code==='Space'||e.key===' '||e.key==='Enter';
if(sp){
if(!$('menu').hidden){e.preventDefault();startGame();return}
var a=document.activeElement;if(a&&a.id==='again'&&!$('end').hidden)return;
if(a&&a.tagName==='BUTTON'&&a.blur)a.blur();
e.preventDefault();if(!e.repeat){capKey('space',true);dropClaw()}return}
var k=dirKey(e);if(k){setTouch(false);K[k]=1;capKey(CAPK[k],true);e.preventDefault()}});
document.addEventListener('keyup',function(e){if(e.code==='Space'||e.key===' ')capKey('space',false);var k=dirKey(e);if(k){K[k]=0;capKey(CAPK[k],false)}});
addEventListener('blur',releaseKeys);
document.addEventListener('visibilitychange',releaseKeys);
var joy=$('joy'),knob=$('knob'),jid=null;
function jmove(e){var r=joy.getBoundingClientRect(),R2=r.width/2,dx=(e.clientX-r.left-R2)/R2,dy=(e.clientY-r.top-R2)/R2,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;l=1}
knob.style.transform='translate('+dx*(R2-28)+'px,'+dy*(R2-28)+'px)';
if(l<.12){jx=jz=0}else{jx=dx;jz=dy}}
joy.addEventListener('pointerdown',function(e){e.preventDefault();jid=e.pointerId;try{joy.setPointerCapture(jid)}catch(x){}jmove(e)});
joy.addEventListener('pointermove',function(e){if(e.pointerId===jid)jmove(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(function(ev){joy.addEventListener(ev,function(e){if(e.pointerId!==jid)return;jid=null;jx=jz=0;knob.style.transform=''})});
$('go').addEventListener('pointerdown',function(e){e.preventDefault();dropClaw()});
addEventListener('touchstart',function(){setTouch(true)},{passive:true});
$('play').addEventListener('click',startGame);
$('again').addEventListener('click',function(){if(S.endMode==='next')startLevel(S.level+1);else{S.total=0;startLevel(1)}});
$('snd').addEventListener('click',function(){muted=!muted;$('snd').textContent=muted?'🔇':'🔊'});
$('lu').addEventListener('click',function(){setLang('uk')});
$('le').addEventListener('click',function(){setLang('en')});
addEventListener('pointermove',function(e){px=(e.clientX/innerWidth-.5)*2});
function resize(){
var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;
baseZ=Math.max(13,8.6/(2*Math.tan(cam.fov*Math.PI/360)*cam.aspect));cam.updateProjectionMatrix()}
addEventListener('resize',resize);
var last=0;
function anim(dt){
gt+=dt;
neon.forEach(function(m,i){m.material.color.setHSL((gt*.08+i*.12)%1,.9,.62)});
var ph=Math.floor(gt*2.2)%2;bulbs.forEach(function(b,i){b.material.color.setHex((i+ph)%2?0xfff2a0:0x8a6a00)});
dust.rotation.y+=dt*.04;dust.position.y=Math.sin(gt*.5)*.1;
items.forEach(function(m){var s=m.userData.spark;if(s){var q=1+Math.sin(gt*14+m.position.x)*.25;s.scale.set(q,q,q)}});
conf.forEach(function(c){if(c.l<=0)return;c.l-=dt;if(c.l<=0){c.m.visible=false;return}
c.vy-=9*dt;c.m.position.x+=c.vx*dt;c.m.position.y+=c.vy*dt;c.m.position.z+=c.vz*dt;c.m.rotation.x+=dt*8;c.m.rotation.y+=dt*6;
if(c.m.position.y<.05){c.m.position.y=.05;c.vy=0;c.vx*=.9;c.vz*=.9}});
var k=1+Math.sin(gt*5)*.04;chute.scale.set(k,k,k);
stick.rotation.z+=(-S.ix*.45-stick.rotation.z)*Math.min(1,dt*12);stick.rotation.x+=(S.iz*.45-stick.rotation.x)*Math.min(1,dt*12);
btnT=Math.max(0,btnT-dt);btn.position.y=-.17-(btnT>0?.04:0);
items.forEach(function(m){var u=m.userData;if(u.wob>0){u.wt+=dt;m.rotation.z=Math.exp(-u.wt*4)*Math.sin(u.wt*16)*.25;if(u.wt>1.3){u.wob=0;m.rotation.z=0}}});
zoom+=(1-zoom)*Math.min(1,dt*2.5);shake=Math.max(0,shake-dt*1.4)}
function loop(now){
var dt=Math.min(.05,(now-last)/1000||0);last=now;
update(dt);anim(dt);
var tx=reduce?0:px*.9+(S.phase==='menu'?Math.sin(gt*.3)*1.6:0)+cx*.1;
cam.position.x+=(tx-cam.position.x)*.05;
var sh=shake*.25;
cam.position.set(cam.position.x+(Math.random()-.5)*sh,3.3+(baseZ-13)*.12+(Math.random()-.5)*sh,baseZ*zoom);
cam.lookAt(0,1.9+(baseZ-13)*.05,0);
R.render(scene,cam);requestAnimationFrame(loop)}
resize();populate(1);applyText();hud();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawSign);
requestAnimationFrame(loop);
})();
</script>
